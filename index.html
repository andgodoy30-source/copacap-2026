<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b33"><title>COPA CAP 2026</title><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--n:#061b33;--p:#082b51;--r:#df2634;--g:#dfb34e;--l:#17659d;--m:#a9bdd0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#06182d,#041426);color:#f7fbff;font-family:Arial,sans-serif}.w{max-width:1180px;margin:auto}.hero{background:radial-gradient(circle at 70% 0,#14588988,transparent 38%),linear-gradient(135deg,#071b35,#0a3159);border-bottom:1px solid var(--l)}.hi{min-height:200px;display:flex;align-items:center;gap:28px;padding:20px}.logo{width:245px;max-height:175px;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 10px 12px #0008)}.title small{letter-spacing:5px;font-weight:900}.title h1{font-size:48px;margin:8px 0}.title h1 span{color:var(--g)}.title p{letter-spacing:3px;font-weight:800}.nav{background:#06182d;border-bottom:2px solid var(--l);position:sticky;top:0;z-index:5}.navin{display:flex;overflow:auto;justify-content:center}.nav button{border:0;background:transparent;color:#d9e5ef;padding:16px 22px;font-weight:900;white-space:nowrap;border-bottom:4px solid transparent}.nav button.active{background:var(--r);color:#fff;border-bottom-color:#ff6570}main{padding:22px 16px 45px}.cats{display:flex;justify-content:center;gap:8px;margin-bottom:18px}.cats button{border:1px solid var(--l);background:#07233f;color:#d3e2ed;border-radius:999px;padding:9px 22px;font-weight:900}.cats button.active{background:var(--r);color:#fff}.dash{display:grid;grid-template-columns:1.3fr .8fr;gap:16px}.card{background:linear-gradient(145deg,#082b51,#051d37);border:1px solid var(--l);border-radius:15px;overflow:hidden;box-shadow:0 8px 24px #0005}.head{padding:14px 16px;border-bottom:1px solid var(--l);font-size:18px;font-weight:900;text-transform:uppercase;border-left:6px solid var(--r)}.body{padding:13px 16px}.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.match{border:1px solid var(--l);border-radius:11px;overflow:hidden;background:linear-gradient(#0a3763,#072a4d)}.mt{background:linear-gradient(90deg,#c71926,#a8111c);padding:8px 10px;display:flex;justify-content:space-between;font-size:11px;font-weight:900;text-transform:uppercase}.mm{padding:16px 10px 12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-size:14px;font-weight:900}.score{font-size:25px;letter-spacing:2px}.x{font-size:18px;color:#9cb5ca}.time{text-align:center;margin-top:9px;color:#b9cddd;font-size:10px;font-weight:700}.status{text-align:center;margin-top:10px}.status span{background:var(--r);border-radius:999px;padding:4px 11px;font-size:9px;font-weight:900}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#051d37;color:#b9cadd;font-size:10px;text-transform:uppercase}th,td{padding:9px 5px;border-bottom:1px solid #12527f;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}.pos{font-weight:900}.top{display:inline-block;background:var(--g);color:#071b35;border-radius:7px;padding:5px;min-width:27px}.sc{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:10px 3px;border-bottom:1px solid #12527f}.rk{width:30px;height:30px;border:1px solid #3386bb;border-radius:50%;display:grid;place-items:center;font-weight:900}.sc:first-child .rk{background:var(--g);color:#172234;border:0}.sc small{display:block;color:var(--m)}.goals{font-size:22px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid var(--l);background:#0a3763;border-radius:10px;padding:17px;text-align:center}.stat b{display:block;font-size:30px}.stat span{font-size:9px;color:#c8d7e3;font-weight:900;text-transform:uppercase}.full{grid-column:1/-1}.single .mg{grid-template-columns:repeat(3,1fr)}footer{border-top:3px solid var(--r);background:#03101f;color:#8198ac;text-align:center;padding:22px;font-size:11px}
@media(max-width:800px){.hi{min-height:145px;padding:14px;gap:12px}.logo{width:125px;max-height:110px}.title h1{font-size:27px}.title small{font-size:9px;letter-spacing:2px}.title p{font-size:9px;letter-spacing:1px}.navin{justify-content:flex-start}.nav button{padding:13px 14px;font-size:12px}.dash{grid-template-columns:1fr}.mg,.single .mg{grid-template-columns:1fr}.cats{justify-content:flex-start;overflow:auto}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header class="hero"><div class="w hi"><img class="logo" src="./logo-copa-cap.png"><div class="title"><small>TORNEIO DE FUTEBOL</small><h1>COPA CAP <span>2026</span></h1><p>ESCOLINHAS DE FUTEBOL</p></div></div></header><nav class="nav"><div class="w navin" id="tabs"></div></nav><main class="w"><div class="cats" id="cats"></div><div id="app"></div></main><footer>COPA CAP 2026 • ESPORTE • AMIZADE • FORMAÇÃO</footer>
<script>
const D={categorias:["Sub-8","Sub-10","Sub-14"],jogos:[{cat:"Sub-8",rod:"1ª Rodada",casa:"Atlético A",fora:"União",pc:3,pf:1,status:"Encerrado",data:"20/09",hora:"08:00"},{cat:"Sub-8",rod:"2ª Rodada",casa:"Estrela",fora:"Atlético A",status:"Agendado",data:"27/09",hora:"08:30"},{cat:"Sub-8",rod:"2ª Rodada",casa:"União",fora:"Leões",status:"Agendado",data:"27/09",hora:"09:40"},{cat:"Sub-10",rod:"1ª Rodada",casa:"Azul",fora:"Vermelho",pc:2,pf:2,status:"Encerrado",data:"20/09",hora:"09:00"},{cat:"Sub-10",rod:"2ª Rodada",casa:"CAP",fora:"União",status:"Agendado",data:"27/09",hora:"09:40"},{cat:"Sub-14",rod:"1ª Rodada",casa:"CAP",fora:"Amigos FC",pc:1,pf:0,status:"Encerrado",data:"20/09",hora:"10:00"}],classificacao:{"Sub-8":[["Atlético A",3,2,1,0,8,3,5,7],["Estrela",3,2,0,1,6,4,2,6],["União",3,1,1,1,4,4,0,4]],"Sub-10":[["Azul",3,2,1,0,8,3,5,7],["Vermelho",3,2,0,1,6,4,2,6],["CAP",3,1,1,1,4,4,0,4]],"Sub-14":[["CAP",3,2,1,0,7,2,5,7],["Amigos FC",3,1,1,1,4,4,0,4]]},artilharia:{"Sub-8":[["João Pedro",6,"Atlético A"],["Lucas Silva",5,"Estrela"],["Enzo Gabriel",4,"União"]],"Sub-10":[["Caio",5,"Azul"],["Miguel",4,"Vermelho"],["Pedro",3,"CAP"]],"Sub-14":[["Rafael",4,"CAP"],["Henrique",2,"Amigos FC"]]}};
let cat="Sub-8",sec="inicio";const $=x=>document.getElementById(x);
function tabs(){let a=[["inicio","⌂ Início"],["jogos","⚽ Jogos"],["classificacao","▥ Classificação"],["artilharia","★ Artilharia"],["numeros","● Números"]];$("tabs").innerHTML=a.map(x=>`<button class="${sec===x[0]?"active":""}" onclick="sec='${x[0]}';render()">${x[1]}</button>`).join("")}
function cats(){$("cats").innerHTML=D.categorias.map(c=>`<button class="${cat===c?"active":""}" onclick="cat='${c}';render()">${c}</button>`).join("")}
function match(j){let f=j.status==="Encerrado";return `<div class="match"><div class="mt"><span>${j.rod}</span><span>${j.data}</span></div><div class="mm"><div class="teams"><span>${j.casa}</span>${f?`<span class="score">${j.pc} × ${j.pf}</span>`:`<span class="x">×</span>`}<span>${j.fora}</span></div>${f?`<div class="status"><span>ENCERRADO</span></div>`:`<div class="time">◷ ${j.hora}</div>`}</div></div>`}
function tabela(){return `<table><thead><tr><th>Pos</th><th>Equipe</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th>PTS</th></tr></thead><tbody>${(D.classificacao[cat]||[]).map((r,i)=>`<tr><td><span class="pos ${i<3?"top":""}">${i+1}</span></td><td><b>${r[0]}</b></td>${r.slice(1).map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
function art(){return (D.artilharia[cat]||[]).map((r,i)=>`<div class="sc"><span class="rk">${i+1}</span><div><b>${r[0]}</b><small>${r[2]}</small></div><span class="goals">${r[1]}</span></div>`).join("")}
function render(){tabs();cats();let js=D.jogos.filter(j=>j.cat===cat),e=js.filter(j=>j.status==="Encerrado"),p=js.filter(j=>j.status!=="Encerrado"),g=e.reduce((s,j)=>s+(+j.pc||0)+(+j.pf||0),0);
let stats=`<div class="stats"><div class="stat"><b>${e.length}</b><span>Jogos realizados</span></div><div class="stat"><b>${g}</b><span>Gols marcados</span></div><div class="stat"><b>${D.classificacao[cat]?.length||0}</b><span>Equipes</span></div><div class="stat"><b>${e.length?(g/e.length).toFixed(1):"0"}</b><span>Gols por jogo</span></div></div>`;
if(sec==="inicio")$("app").innerHTML=`<div class="dash"><section class="card"><div class="head">Próximos jogos</div><div class="body"><div class="mg">${p.length?p.map(match).join(""):"Nenhum jogo agendado."}</div></div></section><section class="card"><div class="head">Últimos resultados</div><div class="body"><div class="mg">${e.length?e.map(match).join(""):"Nenhum resultado."}</div></div></section><section class="card"><div class="head">Classificação</div>${tabela()}</section><section class="card"><div class="head">Artilharia</div><div class="body">${art()}</div></section><section class="card full"><div class="head">Números da Copa</div><div class="body">${stats}</div></section></div>`;
if(sec==="jogos")$("app").innerHTML=`<section class="card single"><div class="head">Jogos e resultados • ${cat}</div><div class="body"><div class="mg">${js.map(match).join("")}</div></div></section>`;
if(sec==="classificacao")$("app").innerHTML=`<section class="card"><div class="head">Classificação • ${cat}</div>${tabela()}</section>`;
if(sec==="artilharia")$("app").innerHTML=`<section class="card"><div class="head">Artilharia • ${cat}</div><div class="body">${art()}</div></section>`;
if(sec==="numeros")$("app").innerHTML=`<section class="card"><div class="head">Números da Copa • ${cat}</div><div class="body">${stats}</div></section>`}
render();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
