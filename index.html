<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#041a33"><title>COPA CAP 2026 — Portal Público</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#03162b;--panel:#06284b;--panel2:#07355f;--line:#0e6ead;--red:#e32231;--red2:#b91421;--gold:#efbd43;--text:#f7fbff;--muted:#a9c2d8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#0d4c7b55,transparent 34%),linear-gradient(#041a33,#021225);color:var(--text);font-family:Arial,sans-serif}.w{max-width:1480px;margin:auto}
.hero{position:relative;overflow:hidden;min-height:242px;background:radial-gradient(ellipse at 50% 115%,#0d609155 0 24%,transparent 56%),linear-gradient(180deg,#07345d,#031a35);border-bottom:1px solid #145b8b}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 90px,#ffffff08 92px 94px),linear-gradient(160deg,transparent 0 72%,#d51e2e 72% 74%,transparent 74% 77%,#d7aa45 77% 79%,transparent 79%);opacity:.7}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:54px;background:linear-gradient(180deg,transparent,#00101f99)}
.hi{position:relative;z-index:1;min-height:242px;display:grid;grid-template-columns:330px 1fr 250px;align-items:center;gap:20px;padding:18px 34px}.logo{width:300px;height:205px;object-fit:contain;filter:drop-shadow(0 8px 12px #000a)}.title{text-align:center;text-shadow:0 4px 8px #0008}.title h1{font-size:70px;line-height:.95;margin:0;font-weight:1000;letter-spacing:2px;font-style:italic}.title h1 span{color:var(--gold)}.title .kicker{letter-spacing:9px;font-weight:900;margin-top:18px}.title .sub{letter-spacing:8px;font-size:14px;font-weight:800;margin-top:12px}.ball{width:190px;height:190px;border-radius:50%;justify-self:end;background:radial-gradient(circle at 35% 30%,#54718e,#07192c 60%,#020a12);box-shadow:inset -20px -22px 35px #0009,0 10px 30px #0008;opacity:.78}
.nav{background:#03152aee;border-bottom:2px solid #0a5e99;position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}.navin{display:flex;justify-content:center;overflow:auto}.nav button{border:0;background:transparent;color:#e6f1fa;padding:17px 27px;font-weight:900;font-size:14px;white-space:nowrap;border-bottom:4px solid transparent}.nav button.active{background:linear-gradient(135deg,#ed2b38,#bd111e);border-bottom-color:#ff5964}.nav button:hover{background:#0a3155}
main{padding:24px 20px 50px}.cats{display:flex;justify-content:center;gap:8px;margin-bottom:18px}.cats button{border:1px solid #1774b1;background:#062643;color:#d9e9f5;border-radius:999px;padding:8px 24px;font-weight:900}.cats button.active{background:linear-gradient(#ef3340,#c91724);border-color:#ff5360}
.home-top{display:grid;grid-template-columns:1.65fr 1fr;gap:14px;margin-bottom:14px}.home-bottom{display:grid;grid-template-columns:1.2fr .86fr .82fr;gap:14px}.card{background:linear-gradient(145deg,#062b51,#041d38);border:1px solid #0b6aa7;border-radius:14px;overflow:hidden;box-shadow:0 10px 28px #0005}.head{height:68px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #0b5b91;position:relative}.head:after{content:"";position:absolute;bottom:-1px;left:12px;width:52px;height:3px;background:var(--red)}.head .ico{font-size:27px}.head h2{margin:0;font-size:25px;text-transform:uppercase;font-style:italic}.head .more{margin-left:auto;border:1px solid #1681cc;border-radius:999px;padding:10px 18px;color:#fff;background:#062b51;font-size:12px;font-weight:900}.body{padding:16px}.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.results .mg{grid-template-columns:repeat(2,1fr)}
.match{border:1px solid #0c72b4;border-radius:11px;overflow:hidden;background:linear-gradient(160deg,#0a3a68,#052543);min-height:170px}.mt{background:linear-gradient(105deg,#d61e2c,#a90e1a);padding:9px 13px;display:flex;justify-content:space-between;font-size:12px;font-weight:900;text-transform:uppercase}.mm{padding:14px 12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.club{display:flex;min-width:0;flex-direction:column;align-items:center;gap:8px;font-weight:900;font-size:13px;text-transform:uppercase}.crest{width:55px;height:62px;clip-path:polygon(50% 0,94% 16%,87% 74%,50% 100%,13% 74%,6% 16%);background:linear-gradient(145deg,#1782c9,#06213b);border:2px solid #d7e9f6;display:grid;place-items:center;font-size:18px;box-shadow:inset 0 0 0 3px #ffffff18}.crest.red{background:linear-gradient(145deg,#e42b35,#5d0810)}.crest.green{background:linear-gradient(145deg,#4eaa56,#123f1c)}.crest.gold{background:linear-gradient(145deg,#f0b52d,#5a3a00)}.versus{font-size:25px;color:#9cb8cf}.score{font-size:33px;font-weight:1000;white-space:nowrap}.time{text-align:center;margin-top:13px;color:#c4d7e6;font-size:13px}.status{text-align:center;margin-top:12px}.status span{background:linear-gradient(#ed2e3b,#bb111e);border-radius:999px;padding:5px 16px;font-size:10px;font-weight:900}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#031a32;color:#bad0e1;font-size:10px;text-transform:uppercase}th,td{padding:9px 6px;border-bottom:1px solid #0c527f;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}.pos{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:8px;font-weight:900}.pos.p1{background:var(--gold);color:#142235}.pos.p2{background:#b9c5d0;color:#142235}.pos.p3{background:#b85c31}.teamcell{font-weight:900}.mini-crest{display:inline-grid;place-items:center;width:23px;height:26px;clip-path:polygon(50% 0,94% 16%,87% 74%,50% 100%,13% 74%,6% 16%);background:#1769a0;margin-right:7px;font-size:9px}
.cat-tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#031a32;border-bottom:1px solid #0c5d93}.cat-tabs button{border:0;background:transparent;color:#d5e4ef;padding:11px;font-weight:900}.cat-tabs button.active{background:linear-gradient(105deg,#e42b38,#b8111d);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.sc{display:grid;grid-template-columns:38px 48px 1fr auto;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #0c527f}.rk{width:34px;height:34px;border:1px solid #2781bb;border-radius:50%;display:grid;place-items:center;font-weight:900}.sc:first-child .rk{background:var(--gold);color:#172234;border:0}.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(#ffd3ad 0 43%,#bd2732 44%);border:2px solid #0e659e}.sc small{display:block;color:var(--muted)}.goals{font-size:24px;font-weight:1000;text-align:right}.goals small{font-size:8px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{min-height:128px;border:1px solid #0d72b3;background:linear-gradient(145deg,#0a3c6b,#062746);border-radius:10px;padding:14px;text-align:center;display:flex;flex-direction:column;justify-content:center}.stat .si{font-size:28px;color:#67b6ef}.stat b{display:block;font-size:38px}.stat span{font-size:10px;color:#d0dfeb;font-weight:900;text-transform:uppercase;line-height:1.4}
.single .mg{grid-template-columns:repeat(3,1fr)}.single-card{max-width:1100px;margin:auto}.about{line-height:1.65;color:#d6e4ef}.teams-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.team-box{border:1px solid #0d72b3;border-radius:12px;padding:18px;text-align:center;background:#072b4d}.team-box .crest{margin:auto auto 10px}
footer{border-top:3px solid var(--red);background:#020e1b;color:#8198ac;text-align:center;padding:24px;font-size:11px;letter-spacing:1px}
@media(max-width:1050px){.hi{grid-template-columns:220px 1fr}.ball{display:none}.logo{width:210px}.title h1{font-size:52px}.home-bottom{grid-template-columns:1fr 1fr}.numbers{grid-column:1/-1}.mg{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.hero,.hi{min-height:145px}.hi{grid-template-columns:118px 1fr;padding:10px 12px;gap:8px}.logo{width:112px;height:112px}.title h1{font-size:29px;letter-spacing:0}.title .kicker{font-size:8px;letter-spacing:3px;margin-top:9px}.title .sub{font-size:7px;letter-spacing:2px;margin-top:7px}.navin{justify-content:flex-start}.nav button{padding:13px 14px;font-size:11px}.home-top,.home-bottom{grid-template-columns:1fr}.numbers{grid-column:auto}.mg,.results .mg,.single .mg,.teams-list{grid-template-columns:1fr}.head{height:58px}.head h2{font-size:19px}.head .more{padding:8px 12px;font-size:10px}.cats{justify-content:flex-start;overflow:auto}.stats{grid-template-columns:1fr 1fr}.stat{min-height:110px}.stat b{font-size:31px}main{padding:16px 10px 35px}}
</style>
</head><body>
<header class="hero"><div class="w hi"><img class="logo" src="./logo-copa-cap.png" alt="COPA CAP"><div class="title"><h1>COPA CAP <span>2026</span></h1><div class="kicker">TORNEIO DE FUTEBOL</div><div class="sub">ESCOLINHAS DE FUTEBOL</div></div><div class="ball" aria-hidden="true"></div></div></header>
<nav class="nav"><div class="w navin" id="tabs"></div></nav>
<main class="w"><div class="cats" id="cats"></div><div id="app"></div></main>
<footer>COPA CAP 2026 • ESPORTE • AMIZADE • FORMAÇÃO</footer>
<script>
const D={categorias:["Sub-8","Sub-10","Sub-14"],jogos:[
{cat:"Sub-8",rod:"1ª Rodada",casa:"Estrela",fora:"União",pc:3,pf:1,status:"Encerrado",data:"20/09",hora:"08:00"},
{cat:"Sub-8",rod:"2ª Rodada",casa:"Estrela",fora:"Atlético A",status:"Agendado",data:"27/09",hora:"08:30"},
{cat:"Sub-8",rod:"2ª Rodada",casa:"União",fora:"Leões",status:"Agendado",data:"27/09",hora:"09:40"},
{cat:"Sub-8",rod:"2ª Rodada",casa:"Leões",fora:"Progresso",status:"Agendado",data:"27/09",hora:"10:20"},
{cat:"Sub-10",rod:"1ª Rodada",casa:"CAP",fora:"Atlético A",pc:2,pf:2,status:"Encerrado",data:"20/09",hora:"09:00"},
{cat:"Sub-10",rod:"2ª Rodada",casa:"CAP",fora:"União",status:"Agendado",data:"27/09",hora:"09:40"},
{cat:"Sub-14",rod:"1ª Rodada",casa:"CAP",fora:"Amigos FC",pc:1,pf:0,status:"Encerrado",data:"20/09",hora:"10:00"}],
classificacao:{"Sub-8":[["CAP",3,2,1,0,8,3,5,7],["Estrela",3,2,0,1,6,4,2,6],["Atlético A",3,1,2,0,5,3,2,5],["União",3,1,1,1,4,4,0,4],["Leões",3,0,1,2,2,6,-4,1],["Progresso",3,0,1,2,1,6,-5,1]],"Sub-10":[["CAP",3,2,1,0,8,3,5,7],["Estrela",3,2,0,1,6,4,2,6],["Atlético A",3,1,2,0,5,3,2,5],["União",3,1,1,1,4,4,0,4]],"Sub-14":[["CAP",3,2,1,0,7,2,5,7],["Amigos FC",3,1,1,1,4,4,0,4]]},
artilharia:{"Sub-8":[["João Pedro",6,"CAP"],["Lucas Silva",5,"Estrela"],["Enzo Gabriel",4,"Atlético A"],["Miguel Santos",4,"União"],["Pedro Henrique",3,"Leões"]],"Sub-10":[["Caio",5,"CAP"],["Miguel",4,"Estrela"],["Pedro",3,"Atlético A"]],"Sub-14":[["Rafael",4,"CAP"],["Henrique",2,"Amigos FC"]]}};
let cat="Sub-8",sec="inicio";const $=x=>document.getElementById(x);
function tabs(){let a=[["inicio","⌂ INÍCIO"],["jogos","🏆 JOGOS"],["classificacao","▥ CLASSIFICAÇÃO"],["artilharia","⚽ ARTILHARIA"],["equipes","👥 EQUIPES"],["sobre","● SOBRE"]];$("tabs").innerHTML=a.map(x=>`<button class="${sec===x[0]?"active":""}" onclick="sec='${x[0]}';render()">${x[1]}</button>`).join("")}
function cats(){ $("cats").style.display=(sec==="sobre"||sec==="equipes")?"none":"flex"; $("cats").innerHTML=D.categorias.map(c=>`<button class="${cat===c?"active":""}" onclick="cat='${c}';render()">${c}</button>`).join("")}
function crestClass(n){let s=[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%4;return ["","red","green","gold"][s]}
function crest(n){return `<span class="crest ${crestClass(n)}">${n.split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}</span>`}
function match(j){let f=j.status==="Encerrado";return `<div class="match"><div class="mt"><span>${j.cat} • ${j.rod}</span><span>${j.data}</span></div><div class="mm"><div class="teams"><div class="club">${crest(j.casa)}<span>${j.casa}</span></div>${f?`<span class="score">${j.pc} × ${j.pf}</span>`:`<span class="versus">×</span>`}<div class="club">${crest(j.fora)}<span>${j.fora}</span></div></div>${f?`<div class="status"><span>ENCERRADO</span></div>`:`<div class="time">◷ ${j.hora}</div>`}</div></div>`}
function catTabs(){return `<div class="cat-tabs">${D.categorias.map(c=>`<button class="${cat===c?"active":""}" onclick="cat='${c}';render()">${c.toUpperCase()}</button>`).join("")}</div>`}
function tabela(){return `${catTabs()}<div class="table-wrap"><table><thead><tr><th>Pos</th><th>Equipe</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th>P</th></tr></thead><tbody>${(D.classificacao[cat]||[]).map((r,i)=>`<tr><td><span class="pos p${i+1}">${i+1}</span></td><td class="teamcell"><span class="mini-crest">${r[0][0]}</span>${r[0]}</td>${r.slice(1).map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function art(){return (D.artilharia[cat]||[]).map((r,i)=>`<div class="sc"><span class="rk">${i+1}</span><span class="avatar"></span><div><b>${r[0]}</b><small>${r[2]}</small></div><span class="goals">${r[1]}<small> gols</small></span></div>`).join("")}
function head(icon,title,more=""){return `<div class="head"><span class="ico">${icon}</span><h2>${title}</h2>${more?`<button class="more" onclick="${more}">VER TODOS ›</button>`:""}</div>`}
function statsAll(){let e=D.jogos.filter(j=>j.status==="Encerrado"),g=e.reduce((s,j)=>s+(+j.pc||0)+(+j.pf||0),0),teams=new Set();D.jogos.forEach(j=>{teams.add(j.casa);teams.add(j.fora)});return `<div class="stats"><div class="stat"><div class="si">▦</div><b>${e.length}</b><span>Jogos<br>realizados</span></div><div class="stat"><div class="si">⚽</div><b>${g}</b><span>Gols<br>marcados</span></div><div class="stat"><div class="si">👥</div><b>${teams.size}</b><span>Equipes<br>participantes</span></div><div class="stat"><div class="si">⚽</div><b>${e.length?(g/e.length).toFixed(1):"0"}</b><span>Média de gols<br>por jogo</span></div></div>`}
function render(){tabs();cats();let js=D.jogos.filter(j=>j.cat===cat),e=js.filter(j=>j.status==="Encerrado"),p=js.filter(j=>j.status!=="Encerrado");
if(sec==="inicio")$("app").innerHTML=`<div class="home-top"><section class="card">${head("▣","Próximos Jogos","sec='jogos';render()")}<div class="body"><div class="mg">${p.length?p.slice(0,3).map(match).join(""):"Nenhum jogo agendado."}</div></div></section><section class="card results">${head("🏆","Últimos Resultados","sec='jogos';render()")}<div class="body"><div class="mg">${e.length?e.slice(-2).reverse().map(match).join(""):"Nenhum resultado."}</div></div></section></div><div class="home-bottom"><section class="card">${head("▥","Classificação","sec='classificacao';render()")}${tabela()}</section><section class="card">${head("⚽","Artilharia","sec='artilharia';render()")}<div class="body">${art()}</div></section><section class="card numbers">${head("👥","Números da Copa")}<div class="body">${statsAll()}</div></section></div>`;
if(sec==="jogos")$("app").innerHTML=`<section class="card single single-card">${head("🏆","Jogos e Resultados")}<div class="body"><div class="mg">${js.length?js.map(match).join(""):"Nenhum jogo nesta categoria."}</div></div></section>`;
if(sec==="classificacao")$("app").innerHTML=`<section class="card single-card">${head("▥","Classificação")}${tabela()}</section>`;
if(sec==="artilharia")$("app").innerHTML=`<section class="card single-card">${head("⚽","Artilharia")}<div class="body">${art()}</div></section>`;
if(sec==="equipes"){let names=[...new Set(D.jogos.flatMap(j=>[j.casa,j.fora]))].sort();$("app").innerHTML=`<section class="card single-card">${head("👥","Equipes")}<div class="body teams-list">${names.map(n=>`<div class="team-box">${crest(n)}<b>${n}</b></div>`).join("")}</div></section>`}
if(sec==="sobre")$("app").innerHTML=`<section class="card single-card">${head("●","Sobre a COPA CAP")}<div class="body about"><p>A COPA CAP é uma competição de escolinhas de futebol voltada à vivência esportiva, participação e integração entre atletas, famílias e equipes.</p><p>Este Portal Público reunirá jogos, resultados, classificação, artilharia, equipes e números da competição. Nesta versão, os dados exibidos ainda são demonstrativos para definição do layout.</p></div></section>`}
render();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
