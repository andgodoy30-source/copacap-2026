<!-- PORTAL PUBLICO COPA CAP 2026 - V0.1 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082d1d">
<title>COPA CAP 2026</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--green:#082d1d;--green2:#145a3a;--gold:#d8ad48;--bg:#f3f5f4;--card:#fff;--text:#17211c;--muted:#69756f}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:22px 16px 18px}
.wrap{max-width:1050px;margin:auto}.brand{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand h1{margin:0;font-size:28px}.brand small{opacity:.8}
.hero{margin-top:18px;padding:18px;border:1px solid rgba(255,255,255,.18);border-radius:16px;background:rgba(255,255,255,.08)}
.hero strong{color:#ffe09a}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}
.tabs button,.cats button{border:0;border-radius:999px;padding:10px 15px;font-weight:700;white-space:nowrap;cursor:pointer}.tabs button.active,.cats button.active{background:var(--green);color:#fff}
main{max-width:1050px;margin:auto;padding:18px 16px 40px}.cats{display:flex;gap:8px;margin-bottom:18px}.cats button{background:#e3e8e5}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card h2{font-size:18px;margin:0 0 12px}.match{padding:13px 0;border-top:1px solid #edf0ee}.match:first-of-type{border-top:0}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-weight:700}.teams .away{text-align:right}.score{font-size:22px;background:#eef3f0;padding:7px 11px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 6px;border-bottom:1px solid #edf0ee;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}
.rank{font-weight:800}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;background:#f5f7f6;border-radius:12px;padding:14px 6px}.stat b{display:block;font-size:24px;color:var(--green)}
.badge{font-size:11px;background:#fff1c7;color:#775900;padding:4px 7px;border-radius:999px;font-weight:700}.empty{color:var(--muted);font-size:14px}
footer{text-align:center;color:var(--muted);padding:25px;font-size:12px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.brand h1{font-size:23px}}
</style></head>
<body>
<header><div class="wrap"><div class="brand"><div><h1>⚽ COPA CAP 2026</h1><small>Portal oficial de resultados</small></div><span class="badge">3ª EDIÇÃO</span></div>
<div class="hero"><strong>ESPORTE • AMIZADE • FORMAÇÃO</strong><br><small>Resultados, classificação e números da competição em um só lugar.</small></div></div></header>
<nav class="tabs" id="tabs"></nav>
<main><div class="cats" id="cats"></div><div id="app"></div></main>
<footer>COPA CAP 2026 • RESPEITO • FAIR PLAY • AMIZADE • EVOLUÇÃO</footer>
<script>
const D={
 categorias:["Sub-8","Sub-10","Sub-14"],
 jogos:[
 {cat:"Sub-8",rod:"1ª Rodada",casa:"Atlético A",fora:"União",pc:3,pf:1,status:"Encerrado",data:"20/09",hora:"08:00"},
 {cat:"Sub-8",rod:"2ª Rodada",casa:"Estrela",fora:"Atlético A",status:"Agendado",data:"27/09",hora:"08:30"},
 {cat:"Sub-10",rod:"1ª Rodada",casa:"Azul",fora:"Vermelho",pc:2,pf:2,status:"Encerrado",data:"20/09",hora:"09:00"},
 {cat:"Sub-14",rod:"1ª Rodada",casa:"CAP",fora:"Amigos FC",pc:1,pf:0,status:"Encerrado",data:"20/09",hora:"10:00"}],
 classificacao:{
 "Sub-8":[["Atlético A",1,1,0,0,3,1,2,3],["União",1,0,0,1,1,3,-2,0]],
 "Sub-10":[["Azul",1,0,1,0,2,2,0,1],["Vermelho",1,0,1,0,2,2,0,1]],
 "Sub-14":[["CAP",1,1,0,0,1,0,1,3],["Amigos FC",1,0,0,1,0,1,-1,0]]},
 artilharia:{
 "Sub-8":[["João",3,"Atlético A"],["Pedro",1,"União"]],
 "Sub-10":[["Lucas",2,"Azul"],["Caio",2,"Vermelho"]],
 "Sub-14":[["Rafael",1,"CAP"]]}
};
let cat="Sub-8",sec="inicio";
const $=id=>document.getElementById(id);
function tabs(){let a=[["inicio","Início"],["jogos","Jogos"],["classificacao","Classificação"],["artilharia","Artilharia"],["numeros","Números"]];$("tabs").innerHTML=a.map(x=>`<button class="${sec===x[0]?"active":""}" onclick="sec='${x[0]}';render()">${x[1]}</button>`).join("")}
function cats(){$("cats").innerHTML=D.categorias.map(c=>`<button class="${cat===c?"active":""}" onclick="cat='${c}';render()">${c}</button>`).join("")}
function jogo(j){return `<div class="match"><div class="meta">${j.rod} • ${j.data} • ${j.hora}</div><div class="teams"><span>${j.casa}</span><span class="score">${j.status==="Encerrado"?j.pc+" × "+j.pf:"×"}</span><span class="away">${j.fora}</span></div></div>`}
function tabela(){let a=D.classificacao[cat]||[];return `<table><thead><tr><th>#</th><th>Time</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th>PTS</th></tr></thead><tbody>${a.map((r,i)=>`<tr><td class="rank">${i+1}</td><td><b>${r[0]}</b></td>${r.slice(1).map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
function art(){return `<table><thead><tr><th>#</th><th>Atleta</th><th>Equipe</th><th>Gols</th></tr></thead><tbody>${(D.artilharia[cat]||[]).map((r,i)=>`<tr><td>${i+1}</td><td><b>${r[0]}</b></td><td>${r[2]}</td><td><b>${r[1]}</b></td></tr>`).join("")}</tbody></table>`}
function render(){
 tabs();cats();let js=D.jogos.filter(j=>j.cat===cat),enc=js.filter(j=>j.status==="Encerrado"),prox=js.filter(j=>j.status!=="Encerrado");
 if(sec==="inicio")$("app").innerHTML=`<div class="grid"><section class="card"><h2>Últimos resultados</h2>${enc.length?enc.map(jogo).join(""):"<p class=empty>Nenhum resultado.</p>"}</section><section class="card"><h2>Próximos jogos</h2>${prox.length?prox.map(jogo).join(""):"<p class=empty>Nenhum jogo agendado.</p>"}</section><section class="card"><h2>Classificação</h2>${tabela()}</section><section class="card"><h2>Artilharia</h2>${art()}</section></div>`;
 if(sec==="jogos")$("app").innerHTML=`<section class="card"><h2>Jogos e resultados • ${cat}</h2>${js.map(jogo).join("")}</section>`;
 if(sec==="classificacao")$("app").innerHTML=`<section class="card"><h2>Classificação • ${cat}</h2>${tabela()}</section>`;
 if(sec==="artilharia")$("app").innerHTML=`<section class="card"><h2>Artilharia • ${cat}</h2>${art()}</section>`;
 if(sec==="numeros"){let gols=enc.reduce((s,j)=>s+(+j.pc||0)+(+j.pf||0),0);$("app").innerHTML=`<section class="card"><h2>Números • ${cat}</h2><div class="stat-grid"><div class=stat><b>${enc.length}</b>Jogos</div><div class=stat><b>${gols}</b>Gols</div><div class=stat><b>${enc.length?(gols/enc.length).toFixed(1):"0"}</b>Gols/jogo</div><div class=stat><b>${D.classificacao[cat]?.length||0}</b>Equipes</div></div></section>`}
}
render();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
